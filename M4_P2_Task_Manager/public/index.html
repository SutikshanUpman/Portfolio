<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Task Manager</title>
  <link href="bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="container py-5">
    <header class="mb-4">
      <p class="text-secondary mb-2">STUDENT WORKSPACE</p>
      <h1>Task Manager</h1>
      <p>Keep track of your coursework.</p>
    </header>
    <form id="task-form" class="d-flex gap-2 mb-4">
      <label for="title" class="visually-hidden">Task title</label>
      <input id="title" class="form-control" placeholder="Add a task" required maxlength="200">
      <button class="btn btn-primary text-nowrap" type="submit">Add task</button>
    </form>
    <p id="message" role="status" aria-live="polite"></p>
    <ul id="tasks" class="list-group"></ul>
    <p id="empty" class="text-secondary">No tasks yet.</p>
  </main>
</body>
</html>
